    pin_type: bool
    direction: in
    value: 'TRUE'
    source: null
  - name: Start_lock
    pin_type: bool
    direction: in
    value: 'FALSE'
    source: null
  - name: process_lock
    pin_type: bool
    direction: in
    value: 'FALSE'
    source: null
  - name: safety_lock
    pin_type: bool
    direction: in
    value: 'FALSE'
    source: null
  - name: Emg_stop
    pin_type: bool
    direction: in
    value: 'FALSE'
    source: null
  - name: StatusWord
    pin_type: DintIO
