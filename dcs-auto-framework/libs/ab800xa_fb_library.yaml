  KDMC2880:
    comment: |
      大布袋收尘器（KDMC2880，16-bit GSD 模块 → DwordIO → STRUCT 路线）。
      要点：.Value 返回 DWord，需 DWORD_TO_DINT/DINT_TO_DWORD 转换；位解包用
      (val/位值) MOD 2；报警用 AlarmCond、事件用 SimpleEventDetector；
      结构体在 Data Type Editor 中表格导入创建（禁止 ST 定义）。
      字段 DP_IN.wStatus / DP_IN.iChamberNo / DP_OUT.wCtrl 为文档明确。
    source: 来源：大布袋_功能块开发规则1.md
    pins:
      - name: DP_IN
        pin_type: KDMC2880_IN
        direction: in_out
        optional: false
        description: DP 输入结构体（字段 wStatus=DwordIO、iChamberNo=DintIO 等）
      - name: DP_OUT
        pin_type: KDMC2880_OUT
        direction: in_out
        optional: false
        description: DP 输出结构体（字段 wCtrl=DwordIO 等）
      - name: DCS_Start
        pin_type: bool
        direction: in
        optional: false
        description: 启动命令（wCtrl bit0 打包）
      - name: DCS_FeedMode
        pin_type: bool
        direction: in
        optional: true
        description: 进料模式（wCtrl bit1 打包）
      - name: DCS_Ready
        pin_type: bool
        direction: out
        optional: false
        description: 就绪（wStatus bit0 解包）
      - name: DCS_RunNet
        pin_type: bool
        direction: out
        optional: true
        description: 网络运行（wStatus bit1 解包）
      - name: DCS_RunHard
        pin_type: bool
        direction: out
        optional: true
        description: 硬接线运行（wStatus bit2 解包）
      - name: DCS_Running
        pin_type: bool
        direction: out
        optional: false
        description: 运行（wStatus bit5 解包）
      - name: DCS_ChamberNo
        pin_type: int
        direction: out
        optional: true
        description: 仓号（iChamberNo，.Value 读取）
      - name: DCS_GenFault
        pin_type: bool
        direction: out
        optional: true
        description: 综合故障（AlarmCond 报警信号源）
    params: {}

  HAVER:
    comment: |
      包装机（Haver Roto-Packer，Deutschmann UNIGATE IC，Ident 0x3218，
      Module 9/10 "122 Worte" → 16-bit DwordIO → STRUCT 路线，Big-Endian）。
      要点：STRUCT 命名 HAVER_IN/HAVER_OUT（122 字段 w0-w121）；每设备占
      4 字节（Status0+Status1 + Alarm）；批次状态字 Word111、已送包数
      Word112、输出控制字 Word1、输出数据 Word0-4；心跳接收 1.6s 脉冲
      （BIT222.7）+ 发送 ~2s 振荡（BIT2.7）；Reset/Start 用 TP 3s 脉冲；
      心跳监测 R_Trig + TOf 5s 超时；14 台设备共 75 个报警位（每报警位
      一个 AlarmCond，不逐位列管脚）；alarm word > 0 即设备故障。
    source: 来源：包装机_开发规则.md
    pins:
      - name: HAVER_IN
        pin_type: HAVER_IN
        direction: in_out
        optional: false
        description: DP 输入结构体（122 字段 w0-w121，DwordIO，Big-Endian）
      - name: HAVER_OUT
        pin_type: HAVER_OUT
        direction: in_out
        optional: false
        description: DP 输出结构体（122 字段 w0-w121，DwordIO）
      - name: Cmd_Reset
        pin_type: bool
        direction: in
        optional: false
        description: 复位命令（TP 3s 脉冲）
      - name: Cmd_Start
        pin_type: bool
        direction: in
        optional: false
        description: 启动命令（TP 3s 脉冲）
      - name: Heartbeat_ok
        pin_type: bool
        direction: out
        optional: false
        description: 心跳正常（R_Trig 上升沿 + TOf 5s 超时监测）
      - name: BatchStatus
        pin_type: int
        direction: out
        optional: true
        description: 批次状态字（Word111，BYTE222）
      - name: BagsSent
        pin_type: int
        direction: out
        optional: true
        description: 已送包数（Word112，BYTE224-225）
      - name: DeviceFault
        pin_type: bool
        direction: out
        optional: false
        description: 设备故障（alarm word > 0）
    params: {}

  # ---------------------------------------------------------------
  # 三、通用标准功能块（ABB_800XA_DP功能块开发规则 明确引脚名）
  # ---------------------------------------------------------------

  RS:
    comment: 复位优先锁存器。复位引脚是 R1（不是 Reset1）。
    source: 来源：ABB_800XA_DP功能块开发规则_20260715_2240.md
    pins:
      - name: Set
        pin_type: bool
        direction: in
        optional: false
        description: 置位输入
      - name: R1
        pin_type: bool
        direction: in
        optional: false
        description: 复位输入（注意不是 Reset1）
      - name: Q1
        pin_type: bool
        direction: out
        optional: false
        description: 锁存输出
    params: {}

  SR:
    comment: 置位优先锁存器。复位引脚是 Reset（不是 R1）。
    source: 来源：ABB_800XA_DP功能块开发规则_20260715_2240.md
    pins:
      - name: S1
        pin_type: bool
        direction: in
        optional: false
        description: 置位输入
      - name: Reset
        pin_type: bool
        direction: in
        optional: false
        description: 复位输入（注意不是 R1）
      - name: Q1
        pin_type: bool
        direction: out
        optional: false
        description: 锁存输出
    params: {}

  TOn:
    comment: 通电延时定时器。输入引脚是 In（首字母大写，不是 IN）。
    source: 来源：ABB_800XA_DP功能块开发规则_20260715_2240.md
    pins:
      - name: In
        pin_type: bool
        direction: in
        optional: false
        description: 启动输入
      - name: PT
        pin_type: time
        direction: in
        optional: false
        description: 延时预设值
      - name: Q
        pin_type: bool
        direction: out
        optional: false
        description: 延时输出
    params: {}

  TOf:
    comment: 断电延时定时器。用于信号滤波/防抖动/安全锁延时。
    source: 来源：ABB_800XA_DP功能块开发规则_20260715_2240.md
    pins:
      - name: In
        pin_type: bool
        direction: in
        optional: false
        description: 输入（信号消失后延时翻转）
      - name: PT
        pin_type: time
        direction: in
        optional: false
        description: 延时预设值
      - name: Q
        pin_type: bool
        direction: out
        optional: false
        description: 延时输出
    params: {}

  TP:
    comment: 脉冲定时器。用于 Start/Stop/Reset 命令生成固定宽度脉冲。
    source: 来源：ABB_800XA_DP功能块开发规则_20260715_2240.md
    pins:
      - name: In
        pin_type: bool
        direction: in
        optional: false
        description: 触发输入
      - name: PT
        pin_type: time
        direction: in
        optional: false
        description: 脉冲宽度
      - name: Q
        pin_type: bool
        direction: out
        optional: false
        description: 脉冲输出
    params: {}

  R_Trig:
    comment: 上升沿触发。输入引脚是 Clk（不是 IN）。
    source: 来源：ABB_800XA_DP功能块开发规则_20260715_2240.md
    pins:
      - name: Clk
        pin_type: bool
        direction: in
        optional: false
        description: 时钟输入（上升沿触发）
      - name: Q
        pin_type: bool
        direction: out
        optional: false
        description: 单周期脉冲输出
    params: {}

  F_Trig:
    comment: 下降沿触发。输入引脚是 Clk（不是 IN）。
    source: 来源：ABB_800XA_DP功能块开发规则_20260715_2240.md
    pins:
      - name: Clk
        pin_type: bool
        direction: in
        optional: false
        description: 时钟输入（下降沿触发）
      - name: Q
        pin_type: bool
        direction: out
        optional: false
        description: 单周期脉冲输出
    params: {}

  CTU:
    comment: 加计数器。参数 CU/RESET/PV 为文档明确，Q 输出为标准计数语义推断。
    source: 来源：ABB_800XA_DP功能块开发规则_20260715_2240.md
    pins:
      - name: CU
        pin_type: bool
        direction: in
        optional: false
        description: 计数脉冲输入
      - name: RESET
        pin_type: bool
        direction: in
        optional: false
        description: 复位输入
      - name: PV
        pin_type: int
        direction: in
        optional: false
        description: 预设值（计数到 PV 输出）
      - name: Q
        pin_type: bool
        direction: out
        optional: true
        description: 计数到达输出（推断）
    params: {}

  AlarmCond:
    comment: 报警条件块。Severity 800=重报警/500=警告；不支持 CondName 参数。
    source: 来源：ABB_800XA_DP功能块开发规则_20260715_2240.md
    pins:
      - name: Signal
        pin_type: bool
        direction: in
        optional: false
        description: 报警信号（条件满足报警）
      - name: Message
        pin_type: string
        direction: in
        optional: false
        description: 报警消息（Var 表字符串变量）
      - name: Severity
        pin_type: int
        direction: in
        optional: false
        description: 严重程度（800 重报警 / 500 警告）
      - name: SrcName
        pin_type: string
        direction: in
        optional: false
        description: 报警源名称
      - name: EnDetection
        pin_type: bool
        direction: in
        optional: false
        description: 检测使能
    params: {}

  SimpleEventDetector:
    comment: 事件检测。内部自动检测上升沿；停止事件需手动反逻辑
      （Signal := (NOT Running) AND prev_running，prev_running 在代码末尾更新）。
    source: 来源：ABB_800XA_DP功能块开发规则_20260715_2240.md
    pins:
      - name: Signal
        pin_type: bool
        direction: in
        optional: false
        description: 事件信号（上升沿记录事件）
      - name: Message
        pin_type: string
        direction: in
        optional: false
        description: 事件消息
    params: {}

  TimerU:
    comment: 运行时间计时器。参数 Hold/Reset/PT/ST/PTChRst 为文档明确。
    source: 来源：ABB_800XA_DP功能块开发规则_20260715_2240.md
    pins:
      - name: Hold
        pin_type: bool
        direction: in
        optional: true
        description: 保持计时
      - name: Reset
        pin_type: bool
        direction: in
        optional: true
        description: 复位
      - name: PT
        pin_type: time
        direction: in
        optional: true
        description: 预设时间
      - name: ST
        pin_type: time
        direction: in
        optional: true
        description: 设定时间
      - name: PTChRst
        pin_type: bool
        direction: in
        optional: true
        description: 预设值复位
    params: {}

