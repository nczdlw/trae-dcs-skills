  ITEC_BATCH:
    comment: |
      皮带秤/配料秤（Schenck INTECONT Tersus，Ident 0x0C9B，FIXED_8_8 模块
      32 字节 IN + 32 字节 OUT，32-bit 独立变量路线）。
      要点：控制字1 Bit3 释放位必须始终置 1；Bit31 打包用 -2147483647-1；
      Start/Stop/Reset 经 TP 1s 脉冲；Running/Heavy_Alarm/Warning 经 TOf 1s
      滤波；报警 3 个（Heavy 800/Warning 500/No_Release 500）；事件 5 个；
      配料秤接 Flow_Setpoint，皮带计量秤不接。
    source: 来源：皮带秤_功能块逻辑说明.md / 皮带秤_开发说明.md / ABB_800XA_DP功能块开发规则_20260715_2240.md
    pins:
      - name: DCS_Start
        pin_type: bool
        direction: in
        optional: false
        description: 启动命令（TP 1s 脉冲 → 控制字1 bit0）
      - name: DCS_Stop
        pin_type: bool
        direction: in
        optional: false
        description: 停止命令（TP 1s 脉冲 → 控制字1 bit1）
      - name: DCS_Reset
        pin_type: bool
        direction: in
        optional: false
        description: 复位命令（TP 1s 脉冲 → 控制字1 bit2）
      - name: Flow_Setpoint
        pin_type: real
        direction: in
        optional: true
        description: 流量设定值（配料秤用，皮带秤不接 → dpOut_FlowSet）
      - name: Select_Batch
        pin_type: bool
        direction: in
        optional: true
        description: 选择批量模式（控制字1 bit16）
      - name: Exit_Batch
        pin_type: bool
        direction: in
        optional: true
        description: 退出批量（控制字1 bit17）
      - name: Interrupt_Batch
        pin_type: bool
        direction: in
        optional: true
        description: 中断批量（控制字1 bit18）
      - name: Accum1_Reset
        pin_type: bool
        direction: in
        optional: true
        description: 累积量1清零（控制字1 bit6）
      - name: Accum2_Reset
        pin_type: bool
        direction: in
        optional: true
        description: 累积量2清零（控制字1 bit7）
      - name: Activate_PreFeeder
        pin_type: bool
        direction: in
        optional: true
        description: 激活预给料机（控制字1 bit30）
      - name: Stop_PreFeeder
        pin_type: bool
        direction: in
        optional: true
        description: 停止预给料机（控制字1 bit31，-2147483647-1 打包）
      - name: Cmd_Tare
        pin_type: bool
        direction: in
        optional: true
        description: 去皮重（控制字2 bit16）
      - name: Cmd_Zero
        pin_type: bool
        direction: in
        optional: true
        description: 调零（控制字2 bit17）
      - name: Cmd_SpanCal
        pin_type: bool
        direction: in
        optional: true
        description: 量程标定（控制字2 bit18）
      - name: Cmd_PulseCal
        pin_type: bool
        direction: in
        optional: true
        description: 脉冲标定（控制字2 bit19）
      - name: Cmd_Apply
        pin_type: bool
        direction: in
        optional: true
        description: 确认执行（控制字2 bit27）
      - name: Cmd_Cancel
        pin_type: bool
        direction: in
        optional: true
        description: 取消操作（控制字2 bit28）
      - name: Cmd_GetTime
        pin_type: bool
        direction: in
        optional: true
        description: 读取设备时间（控制字2 bit29）
      - name: dpIn_Status1
        pin_type: DintIO
        direction: in
        optional: false
        description: 状态字1（IW.1，位解包 .Value）
      - name: dpIn_Status2
        pin_type: DintIO
        direction: in
        optional: false
        description: 状态字2（IW.2）
      - name: dpIn_Flow
        pin_type: RealIO
        direction: in
        optional: false
        description: 实际流量（IW.3，kg/h）
      - name: dpIn_Accum1
        pin_type: RealIO
        direction: in
        optional: true
        description: 累积量1（IW.4，kg）
      - name: dpIn_Load
        pin_type: RealIO
        direction: in
        optional: true
        description: 皮带负荷（IW.5，kg/m）
      - name: dpIn_Speed
