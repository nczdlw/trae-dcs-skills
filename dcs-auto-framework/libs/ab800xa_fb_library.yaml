      - name: dpOut_Spare7
        pin_type: DintIO
        direction: out
        optional: true
        description: 输出预留（QW.15）
      - name: Running
        pin_type: bool
        direction: out
        optional: false
        description: 运行（状态字1 bit0，TOf 1s 滤波）
      - name: Heavy_Alarm
        pin_type: bool
        direction: out
        optional: false
        description: 重报警（状态字1 bit5，TOf 1s 滤波，AlarmCond 800）
      - name: Warning
