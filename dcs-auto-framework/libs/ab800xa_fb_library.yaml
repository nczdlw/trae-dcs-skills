# =============================================================================
# ABB 800xA 功能块库（从 knowledge 文档提取，F163 项目基线）
#
# 来源文件（只读基准）：
#   - knowledge/90-项目档案/F163_800xA编程规则总纲.md        （总纲，唯一现行规则入口）
#   - knowledge/20-DP通讯与设备功能块/ABB_800XA_DP功能块开发规则_20260715_2240.md
#   - knowledge/20-DP通讯与设备功能块/中压变频器_FB开发规则2.md
#   - knowledge/20-DP通讯与设备功能块/中压变频器_功能块逻辑说明.md
#   - knowledge/20-DP通讯与设备功能块/大布袋_功能块开发规则1.md
#   - knowledge/20-DP通讯与设备功能块/皮带秤_功能块逻辑说明.md
#   - knowledge/20-DP通讯与设备功能块/皮带秤_开发说明.md
#   - knowledge/20-DP通讯与设备功能块/包装机_开发规则.md
#   - knowledge/30-莱歇磨与连锁分析/莱歇磨分组编程规则.md
#   - knowledge/30-莱歇磨与连锁分析/莱歇磨FBD程序架构说明.md
#
# 来源标注规则：文档明确 -> "来源：<文件名>"；推断 -> "来源：<文件名>（管脚推断）"
# 注意：MOTOR1/SignalInReal/GROUP1 的管脚有正式管脚表来源；SMOTOR_PROV 等
#       文档未给正式管脚表，管脚为按文档要点推断，已在 source 标注。
# =============================================================================
library: AB800xA
platform: ABB 800xA V6.1.0（Control Builder M，IEC 61131-3）
comment: |
  F163 越南粉磨站项目 800xA 功能块库，从 knowledge 文档提取。
  含总纲选型表 10 类（MOTOR1/SMOTOR_PROV/SMOTORD_PROV/SignalInReal/
  SignalInBool/GROUP1/VALVE1/PVALVE/ABBLVVVF/ABBMVVVF）、DP 设备规则 3 类
  （ITEC_BATCH/KDMC2880/HAVER）与通用标准功能块 15 类。
  管脚/参数均标注来源；推断内容显式标注。

fbs:
  # ---------------------------------------------------------------
  # 一、总纲功能块选型表类型（F163_800xA编程规则总纲.md §4.3）
  # ---------------------------------------------------------------

  MOTOR1:
    comment: |
      普通电机/加热器控制（硬件 DI/DO 回路）。
      要点：三个 lock 管脚 true=锁定、直接赋值不取反；safety_lock 经 TOf
      延时并触发 Fault；MOTOR1 没有 O2 管脚，O2 是硬件 DO（逻辑与
      start_lock 相反，true=许可）。
    source: 来源：莱歇磨分组编程规则.md / F163_800xA编程规则总纲.md
    pins:
      - name: Description
        pin_type: string
        direction: in
        optional: true
        description: 设备描述（string[80]，格式"英文/中文 - 莱歇编号"）
      - name: Ready
        pin_type: bool
        direction: in
        optional: false
        description: 就绪反馈（DI）
      - name: Running
        pin_type: bool
        direction: in
        optional: false
        description: 运行反馈（DI）
      - name: Emg_stop
        pin_type: bool
        direction: in
        optional: false
        description: 急停信号
      - name: Group_start
        pin_type: bool
        direction: in
        optional: true
        description: 组启动（来自 GROUP 的 G_start.Bx）
      - name: Group_stop
        pin_type: bool
        direction: in
        optional: true
        description: 组停止（来自 GROUP 的 G_stop.Bx）
      - name: Local_start
        pin_type: bool
        direction: in
        optional: true
        description: 本地启动
      - name: start_lock
        pin_type: bool
        direction: in
        optional: false
        description: 启动锁定（Initial=true，true=锁定阻止启动）
      - name: process_lock
        pin_type: bool
        direction: in
        optional: false
        description: 过程锁定（Initial=true，true=锁定，运行中停止）
      - name: safety_lock
        pin_type: bool
        direction: in
        optional: false
        description: 安全锁定（Initial=true，true=锁定，经 TOf 延时后停止并触发 Fault）
      - name: speedswitch
        pin_type: bool
        direction: in
        optional: true
        description: 速度开关
      - name: ext_fault
        pin_type: bool
        direction: in
        optional: true
        description: 外部故障
      - name: LOCAL
        pin_type: bool
        direction: in
        optional: true
        description: 本地/远程模式
      - name: Drive
        pin_type: bool
        direction: out
        optional: false
        description: 驱动输出（→ 硬件 DO）
      - name: Fault
        pin_type: bool
        direction: out
        optional: false
        description: 故障输出
    params: {}

  SMOTOR_PROV:
    comment: |
      DP 通讯电机（Profibus DP，Control Word/Status Word 位打包）。
      要点：32 位数据只能转 DintIO/RealIO（DwordIO 不可用）；Release bit
      （CW1 bit3）必须始终置 1；ST 中 DintIO 直接兼容 DInt 无需转换。
      文档未提供正式管脚表，以下为按 DP 电机模式推断的接口。
    source: 来源：F163_800xA编程规则总纲.md / 莱歇磨分组编程规则.md（管脚推断）
    pins:
      - name: Group_start
        pin_type: bool
        direction: in
        optional: true
        description: 组启动命令（推断）
      - name: Group_stop
        pin_type: bool
        direction: in
        optional: true
        description: 组停止命令（推断）
      - name: Start_lock
        pin_type: bool
        direction: in
        optional: false
        description: 启动锁定 true=锁定（推断）
      - name: process_lock
        pin_type: bool
        direction: in
        optional: false
        description: 过程锁定 true=锁定（推断）
      - name: safety_lock
        pin_type: bool
        direction: in
        optional: false
        description: 安全锁定 true=锁定（推断）
      - name: Emg_stop
        pin_type: bool
        direction: in
        optional: false
        description: 急停信号（推断）
      - name: Reset
        pin_type: bool
        direction: in
        optional: true
        description: 故障复位（推断）
      - name: StatusWord
        pin_type: DintIO
        direction: in
        optional: false
        description: 状态字（DP 输入，ST 用 .Value 读取，推断）
      - name: ControlWord
        pin_type: DintIO
        direction: out
        optional: false
        description: 控制字（DP 输出，bit3 释放位恒置 1，推断）
      - name: Running
        pin_type: bool
        direction: out
        optional: false
        description: 运行反馈（推断）
      - name: Ready
        pin_type: bool
        direction: out
        optional: false
        description: 就绪（推断）
      - name: Fault
        pin_type: bool
        direction: out
        optional: false
        description: 故障（推断）
    params: {}

  SMOTORD_PROV:
    comment: |
      DP 通讯双向电机（正/反转，Profibus DP）。
      总纲选型表标注"双方向 SMOTORD_PROV"；文档未提供管脚表，管脚为按
      双方向电机推断（在 SMOTOR_PROV 基础上增加方向选择）。
    source: 来源：F163_800xA编程规则总纲.md（管脚推断）
    pins:
      - name: Group_start
        pin_type: bool
        direction: in
        optional: true
        description: 组启动命令（推断）
      - name: Group_stop
        pin_type: bool
        direction: in
        optional: true
        description: 组停止命令（推断）
      - name: Start_lock
        pin_type: bool
        direction: in
        optional: false
        description: 启动锁定 true=锁定（推断）
      - name: process_lock
        pin_type: bool
        direction: in
        optional: false
        description: 过程锁定 true=锁定（推断）
      - name: safety_lock
        pin_type: bool
        direction: in
        optional: false
        description: 安全锁定 true=锁定（推断）
      - name: Emg_stop
        pin_type: bool
        direction: in
        optional: false
        description: 急停信号（推断）
      - name: Dir_fwd
        pin_type: bool
        direction: in
        optional: false
        description: 正向运行命令（推断）
      - name: Dir_rev
        pin_type: bool
        direction: in
        optional: false
        description: 反向运行命令（推断）
      - name: Reset
        pin_type: bool
        direction: in
        optional: true
        description: 故障复位（推断）
      - name: StatusWord
        pin_type: DintIO
        direction: in
        optional: false
        description: 状态字（DP 输入，推断）
      - name: ControlWord
        pin_type: DintIO
        direction: out
        optional: false
        description: 控制字（DP 输出，推断）
      - name: Running
        pin_type: bool
        direction: out
        optional: false
        description: 运行反馈（推断）
      - name: Ready
        pin_type: bool
        direction: out
        optional: false
        description: 就绪（推断）
      - name: Fault
        pin_type: bool
        direction: out
        optional: false
        description: 故障（推断）
    params: {}

  SignalInReal:
    comment: |
      模拟量监测（SignalLib 标准库，六级报警 L/LL/LLL/H/HH/HHH）。
      要点：连锁只用 GTHStat/GTHHStat（受 Enable 控制），不用 GTH/GTHAct；
      温度只启用 H/HH（EnableL/LL/LLL:=FALSE），压力按正式图启用 L/H(/HH)；
      阈值在 ST 中初始化（禁止 Var 表 Initial Value 写结构体聚合，Error 1340）；
      每个实例配套 4 个变量（_T_IP/SignalLib.Signal、_T_H、_T_HH、报警名 string）。
    source: 来源：莱歇磨分组编程规则.md / F163_800xA编程规则总纲.md
    pins:
      - name: Name
        pin_type: string
        direction: in
        optional: false
        description: 报警对象名称（string[30]）
      - name: In
        pin_type: RealIO
        direction: in_out
        optional: false
        description: AI 模拟量输入（硬件配置创建，ST 用 .Value 访问）
      - name: Out
        pin_type: real
        direction: out
        optional: false
        description: 标准化工程值输出
      - name: InteractionPar
        pin_type: SignalInRealPar
        direction: in_out
        optional: false
        description: 交互参数结构体（阈值/使能在 ST 中初始化）
      - name: GTH
        pin_type: bool
        direction: out
        optional: true
        description: 当前值>LevelH 纯比较结果（不受 Enable 控制）
      - name: GTHStat
        pin_type: bool
        direction: out
        optional: true
        description: H 报警状态（受 Enable 控制，连锁逻辑用此）
      - name: GTHAct
        pin_type: bool
        direction: out
        optional: true
        description: H 报警动作（受 Enable 和 Inhibit 双重控制）
      - name: GTHH
        pin_type: bool
        direction: out
        optional: true
        description: 当前值>LevelHH 纯比较结果（命名按 GTH 规律推断）
      - name: GTHHStat
        pin_type: bool
        direction: out
        optional: true
        description: HH 报警状态（受 Enable 控制）
      - name: GTHHAct
        pin_type: bool
        direction: out
        optional: true
        description: HH 报警动作（推断）
      - name: GTL
        pin_type: bool
        direction: out
        optional: true
        description: L 报警纯比较（命名推断）
      - name: GTLStat
        pin_type: bool
        direction: out
        optional: true
        description: L 报警状态（推断）
      - name: GTLAct
        pin_type: bool
        direction: out
        optional: true
        description: L 报警动作（推断）
      - name: GTLL
        pin_type: bool
        direction: out
        optional: true
        description: LL 报警纯比较（推断）
      - name: GTLLStat
        pin_type: bool
        direction: out
        optional: true
        description: LL 报警状态（推断）
      - name: GTLLAct
        pin_type: bool
        direction: out
        optional: true
        description: LL 报警动作（推断）
      - name: GTLLL
        pin_type: bool
        direction: out
        optional: true
        description: LLL 报警纯比较（推断）
      - name: GTLLLStat
        pin_type: bool
        direction: out
        optional: true
        description: LLL 报警状态（推断）
      - name: GTLLLAct
        pin_type: bool
        direction: out
        optional: true
        description: LLL 报警动作（推断）
      - name: GTHHH
        pin_type: bool
        direction: out
        optional: true
        description: HHH 报警纯比较（六级报警，推断）
      - name: GTHHHStat
        pin_type: bool
        direction: out
        optional: true
        description: HHH 报警状态（推断）
      - name: GTHHHAct
        pin_type: bool
        direction: out
        optional: true
        description: HHH 报警动作（推断）
    params:
      LevelH:
        type: real
        description: H 报警阈值（ST 初始化，如温度 60.0）
      LevelHH:
        type: real
        description: HH 报警阈值（如温度 65.0）
      LevelL:
        type: real
        description: L 报警阈值（压力信号用，如 0.5/15.0）
      LevelLL:
        type: real
        description: LL 报警阈值（推断字段）
      LevelLLL:
        type: real
        description: LLL 报警阈值（推断字段）
      LevelHHH:
        type: real
        description: HHH 报警阈值（推断字段）
      EnableH:
        type: bool
        description: H 报警使能（推断字段，默认启用）
      EnableHH:
        type: bool
        description: HH 报警使能（温度启用，压力按图）
      EnableHHH:
        type: bool
        description: HHH 报警使能（文档出现，默认 FALSE）
      EnableL:
        type: bool
        description: L 报警使能（温度 FALSE，压力按图启用）
      EnableLL:
        type: bool
        description: LL 报警使能（默认 FALSE）
      EnableLLL:
        type: bool
        description: LLL 报警使能（默认 FALSE）

  SignalInBool:
    comment: |
      布尔信号监测（DI 信号标准化）。
      总纲选型表与分组编程规则仅说明用途（DI 信号标准化），
      文档未提供管脚表，以下为按布尔信号监测推断的接口。
    source: 来源：F163_800xA编程规则总纲.md / 莱歇磨分组编程规则.md（管脚推断）
    pins:
      - name: Name
        pin_type: string
        direction: in
        optional: true
        description: 信号对象名称（推断）
      - name: In
        pin_type: BoolIO
        direction: in_out
        optional: false
        description: DI 布尔输入（硬件通道，推断）
      - name: Out
        pin_type: bool
        direction: out
        optional: false
        description: 标准化布尔输出（推断）
    params: {}

  GROUP1:
    comment: |
      莱歇专用组控制（工程内部类型，非库内标准 Group）。
      从 Group 复制出 GROUP1，新增 CON/COFF（bool 输入、单周期脉冲远程启停）；
      禁止 Gxx.Gstart_cmd 式外部直写内部变量；G_start/G_stop 为 Boolean16，
      .B1~.Bn 按序对应组内设备；GROUP_STATUS 供上级组直接读取。
    source: 来源：F163_800xA编程规则总纲.md / 莱歇磨分组编程规则.md
    pins:
      - name: STEP
        pin_type: int
        direction: in
        optional: false
        description: 组内设备数（G10 主辅机组为单级 STEP=1）
      - name: run_1
        pin_type: bool
        direction: in
        optional: true
        description: 各设备运行反馈（run_1~run_n 按设备数扩展）
      - name: Emg_stop
        pin_type: bool
        direction: in
        optional: false
        description: 急停信号
      - name: G_start
        pin_type: Boolean16
        direction: out
        optional: false
        description: 组启动命令（位访问 .B1~.Bn 对应组内设备）
      - name: G_stop
        pin_type: Boolean16
        direction: out
        optional: false
        description: 组停止命令（位访问 .B1~.Bn）
      - name: GROUP_STATUS
        pin_type: bool
        direction: out
        optional: false
        description: 组状态（上级组直接读取，不重复计算）
      - name: CON
        pin_type: bool
        direction: in
        optional: true
        description: 远程启动命令（单周期脉冲，GROUP1 新增接口）
      - name: COFF
        pin_type: bool
        direction: in
        optional: true
        description: 远程停止命令（单周期脉冲，GROUP1 新增接口）
    params: {}

  VALVE1:
    comment: |
      阀门控制。总纲选型表（§4.3）明确"阀门 VALVE1 / PVALVE"，
      但文档未提供管脚定义，待从现场库或官方手册补充，暂不列管脚。
    source: 来源：F163_800xA编程规则总纲.md（仅选型表，管脚未提供）
    pins: []
    params: {}

  PVALVE:
    comment: |
      阀门控制。总纲选型表（§4.3）明确"阀门 VALVE1 / PVALVE"，
      但文档未提供管脚定义，待从现场库或官方手册补充，暂不列管脚。
    source: 来源：F163_800xA编程规则总纲.md（仅选型表，管脚未提供）
    pins: []
    params: {}

  ABBLVVVF:
    comment: |
      低压变频器（FPBA-01 通信模块，ABB Drives 行规，20000=100%）。
      逻辑：启动条件（Group_start AND Start_lock AND start_lock_en AND RDY_ON
      AND RDY_RUN）→ RS 锁存 drive → 状态机 CW（0x047E/0x047F，bit3 经 500ms
      延时使能）→ 运行监控（TOn run_time 超时故障，SR 锁存）→ 给定换算
      REAL_TO_DINT(SET_L/Freq_Max*20000)。
      换算：频率 20000=100%，电流/功率 10=1 单位。LV 4 报警。
      信号名来自文档，管脚方向/类型按语义推断。
    source: 来源：中压变频器_功能块逻辑说明.md / 中压变频器_FB开发规则2.md / F163_800xA编程规则总纲.md（管脚推断）
    pins:
      - name: Group_start
        pin_type: bool
        direction: in
        optional: false
        description: 组启动命令
      - name: Start_lock
        pin_type: bool
        direction: in
        optional: false
        description: 启动联锁 true=允许
      - name: start_lock_en
        pin_type: bool
        direction: in
        optional: false
        description: 启动联锁使能（启动后自锁断开）
      - name: Single_start
        pin_type: bool
        direction: in
        optional: true
        description: 单台启动
      - name: Single_stop
        pin_type: bool
        direction: in
        optional: true
        description: 单台停止（斜坡停车 OFF1）
      - name: EMG_stop
        pin_type: bool
        direction: in
        optional: false
        description: 急停（LV 直接控制 OFF3 快速停车）
      - name: Ext_fault
        pin_type: bool
        direction: in
        optional: true
        description: 外部故障
      - name: process_lock
        pin_type: bool
        direction: in
        optional: false
        description: 工艺联锁 true=允许，断开即停止
      - name: safe_lock
        pin_type: bool
        direction: in
        optional: false
        description: 安全联锁 true=允许，经 TOf 延时
      - name: safe_lock_en
        pin_type: bool
        direction: in
        optional: false
        description: 安全联锁使能
      - name: Reset
        pin_type: bool
        direction: in
        optional: true
        description: 故障复位（CW bit7 复位脉冲）
      - name: EXTINPUT
        pin_type: bool
        direction: in
        optional: true
        description: 自动/本地给定选择（true=自动给定）
      - name: SET_AUTO
        pin_type: real
        direction: in
        optional: true
        description: 自动给定（Hz）
      - name: LOCAL_PERM
        pin_type: bool
        direction: in
        optional: true
        description: 本地允许（本地升/降速使能）
      - name: Freq_Up
        pin_type: bool
        direction: in
        optional: true
        description: 本地升速（每周期 +0.2Hz）
      - name: Freq_Dn
        pin_type: bool
        direction: in
        optional: true
        description: 本地降速（每周期 -0.2Hz）
      - name: Freq_Max
        pin_type: real
        direction: in
        optional: false
        description: 最大频率（给定上限）
      - name: Frq_min
        pin_type: real
        direction: in
        optional: false
        description: 最小频率（给定下限）
      - name: run_time
        pin_type: time
        direction: in
        optional: false
        description: 运行确认延时（TOn 超时判故障）
      - name: ZSPSWITCH
        pin_type: bool
        direction: in
        optional: true
