      与 ABBLVVVF 差异：启动条件增加 READY1 且用 NOT B6(SWC_ON_INHIB) 替代
      RDY_RUN；急停经 TOf_1（ES_TIME）延时；电机温度监控（motor_temp=
      INPUTDINT6/10 > temp_Limit 锁存 TEMP_ALARM）；频率/转速/百分比三模式
      （set_type）；MV 6 报警。信号名来自文档，方向/类型按语义推断。
    source: 来源：中压变频器_功能块逻辑说明.md / 中压变频器_FB开发规则2.md / F163_800xA编程规则总纲.md（管脚推断）
