<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" font-family="Microsoft YaHei, sans-serif">
  <!-- 背景 -->
  <rect width="1100" height="520" fill="#fff"/>
  <!-- 根节点 -->
  <rect x="20" y="240" width="240" height="60" rx="10" fill="#1a73e8"/>
  <text x="140" y="264" fill="#fff" text-anchor="middle" font-size="16" font-weight="bold">T2_IO表格模板</text>
  <text x="140" y="288" fill="#fff" text-anchor="middle" font-size="12">三平台 IO 表格模板 + 校验器</text>
  <text x="140" y="306" fill="#fff" text-anchor="middle" font-size="11">进度 6/6</text>
  <!-- 连线 根 → L1 -->
  <path d="M260,270 C300,270 300,120 330,120" stroke="#bbb" fill="none"/>
  <path d="M260,270 C300,270 300,420 330,420" stroke="#bbb" fill="none"/>
  <!-- L1-1 研究与提取 -->
  <rect x="330" y="100" width="200" height="40" rx="8" fill="#e8f0fe"/>
  <text x="430" y="125" fill="#174ea6" text-anchor="middle" font-size="14" font-weight="bold">L1-1 研究与提取</text>
  <!-- L1-1 叶 -->
  <rect x="620" y="52" width="14" height="14" fill="#34A853"/>
  <rect x="640" y="48" width="380" height="32" rx="6" fill="#f5f5f5"/>
  <text x="652" y="69" fill="#333" font-size="13">L1-1.1 读取 5 个 knowledge 基准文件提取 800xA 列</text>
  <rect x="620" y="112" width="14" height="14" fill="#34A853"/>
  <rect x="640" y="108" width="380" height="32" rx="6" fill="#f5f5f5"/>
  <text x="652" y="129" fill="#333" font-size="13">L1-1.2 BDM 文档依据检索（无匹配，不设 BDM 列）</text>
  <!-- L1-2 代码与模板产出 -->
  <rect x="330" y="400" width="200" height="40" rx="8" fill="#e8f0fe"/>
  <text x="430" y="425" fill="#174ea6" text-anchor="middle" font-size="14" font-weight="bold">L1-2 代码与模板产出</text>
  <!-- L1-2 叶 -->
  <rect x="620" y="340" width="14" height="14" fill="#34A853"/>
  <rect x="640" y="336" width="380" height="32" rx="6" fill="#f5f5f5"/>
  <text x="652" y="357" fill="#333" font-size="13">L1-2.1 io_template.py 模板结构 + 校验器</text>
  <rect x="620" y="388" width="14" height="14" fill="#34A853"/>
  <rect x="640" y="384" width="380" height="32" rx="6" fill="#f5f5f5"/>
  <text x="652" y="405" fill="#333" font-size="13">L1-2.2 ab800xa_io_template.yaml（35 列，文档列）</text>
  <rect x="620" y="436" width="14" height="14" fill="#34A853"/>
  <rect x="640" y="432" width="380" height="32" rx="6" fill="#f5f5f5"/>
  <text x="652" y="453" fill="#333" font-size="13">L1-2.3 pcs7_io_template.yaml（草案，待核实）</text>
  <rect x="620" y="484" width="14" height="14" fill="#34A853"/>
  <rect x="640" y="480" width="380" height="32" rx="6" fill="#f5f5f5"/>
  <text x="652" y="501" fill="#333" font-size="13">L1-2.4 freelance_io_template.yaml（草案，待核实）</text>
  <!-- L1-2.5 自测：单独放一行 -->
  <path d="M260,270 C300,270 300,330 640,330" stroke="#bbb" fill="none"/>
  <rect x="620" y="248" width="14" height="14" fill="#34A853"/>
  <rect x="640" y="244" width="380" height="32" rx="6" fill="#f5f5f5"/>
  <text x="652" y="265" fill="#333" font-size="13">L1-2.5 自测：三 YAML 校验通过，输出「T2 自测通过」</text>
  <!-- 图例 -->
  <rect x="20" y="470" width="14" height="14" fill="#9E9E9E"/>
  <text x="40" y="482" fill="#333" font-size="12">未开始</text>
  <rect x="100" y="470" width="14" height="14" fill="#F5A623"/>
  <text x="120" y="482" fill="#333" font-size="12">进行中</text>
  <rect x="180" y="470" width="14" height="14" fill="#34A853"/>
  <text x="200" y="482" fill="#333" font-size="12">完成已核对</text>
  <rect x="280" y="470" width="14" height="14" fill="#EA4335"/>
  <text x="300" y="482" fill="#333" font-size="12">有问题待复查</text>
</svg>
