<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, sans-serif" width="1180" height="400">
  <!-- 根节点 -->
  <rect x="20" y="160" width="240" height="60" rx="10" fill="#1a73e8"/>
