  <!-- 连线 -->
  <path d="M260,190 C310,190 310,80 360,80" stroke="#bbb" fill="none"/>
  <path d="M260,190 C310,190 310,290 360,290" stroke="#bbb" fill="none"/>

  <!-- L1-1 修改三份源文件 -->
  <rect x="360" y="56" width="220" height="48" rx="8" fill="#e8f0fe"/>
  <text x="470" y="78" fill="#174ea6" text-anchor="middle" font-size="14" font-weight="bold">L1-1 修改三份源文件</text>
  <text x="470" y="96" fill="#5f6368" text-anchor="middle" font-size="11">12 条映射全部落地</text>

  <path d="M580,80 C620,80 620,40 660,40" stroke="#ccc" fill="none"/>
  <path d="M580,80 C620,80 620,90 660,90" stroke="#ccc" fill="none"/>
  <path d="M580,80 C620,80 620,140 660,140" stroke="#ccc" fill="none"/>

  <rect x="660" y="33" width="14" height="14" fill="#34A853"/>
  <rect x="680" y="29" width="400" height="24" rx="6" fill="#f5f5f5"/>
  <text x="692" y="46" fill="#333" font-size="13">L1-1.1 用户规则落地 R-1~R-5</text>

  <rect x="660" y="83" width="14" height="14" fill="#34A853"/>
  <rect x="680" y="79" width="400" height="24" rx="6" fill="#f5f5f5"/>
  <text x="692" y="96" fill="#333" font-size="13">L1-1.2 任务树 skill 落地 S-1~S-3（+部署副本同步）</text>

  <rect x="660" y="133" width="14" height="14" fill="#34A853"/>
