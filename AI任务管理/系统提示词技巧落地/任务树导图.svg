  <text x="692" y="146" fill="#333" font-size="13">L1-1.3 连锁分析 skill 落地 I-1~I-4（+部署副本同步）</text>

  <!-- L1-2 提交与合并 -->
  <rect x="360" y="266" width="220" height="48" rx="8" fill="#e8f0fe"/>
  <text x="470" y="288" fill="#174ea6" text-anchor="middle" font-size="14" font-weight="bold">L1-2 提交与合并</text>
  <text x="470" y="306" fill="#5f6368" text-anchor="middle" font-size="11">变更上远端 master</text>

  <path d="M580,290 C620,290 620,260 660,260" stroke="#ccc" fill="none"/>
  <path d="M580,290 C620,290 620,320 660,320" stroke="#ccc" fill="none"/>

  <rect x="660" y="253" width="14" height="14" fill="#34A853"/>
  <rect x="680" y="249" width="400" height="24" rx="6" fill="#f5f5f5"/>
  <text x="692" y="266" fill="#333" font-size="13">L1-2.1 提交推送 trae 分支</text>

  <rect x="660" y="313" width="14" height="14" fill="#34A853"/>
  <rect x="680" y="309" width="400" height="24" rx="6" fill="#f5f5f5"/>
  <text x="692" y="326" fill="#333" font-size="13">L1-2.2 合并 master 并推送</text>

  <!-- 图例 -->
  <rect x="20" y="360" width="14" height="14" fill="#9E9E9E"/>
  <text x="40" y="372" fill="#5f6368" font-size="12">未开始</text>
  <rect x="110" y="360" width="14" height="14" fill="#F5A623"/>
